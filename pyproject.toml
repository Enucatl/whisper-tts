[project]
name = "whisper-tts"
authors = [
{ name = "Enucatl", email = "1423701+Enucatl@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">= 3.12"
dependencies = [
  "click",
  "deepgram-sdk >= 3, < 4.0",
  "google-generativeai",
  "pandas",
]
dynamic = ["version"]

[build-system]
requires = [
    "setuptools >= 61",
    "wheel",
    "setuptools-git-versioning",
]
build-backend = "setuptools.build_meta"

[tools.setuptools-git-versioning]
enabled = true

[tool.ruff]
select = ["ALL"]
