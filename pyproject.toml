[project]
name = "whisper-tts"
version = "0.0.0"
authors = [
{ name = "Enucatl", email = "1423701+Enucatl@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">= 3.14"
dependencies = [
  "click",
  "deepgram-sdk >= 3, < 4.0",
  "shared-inference @ git+https://github.com/Enucatl/shared-inference.git",
]

[project.scripts]
whisper-tts = "whisper_tts.cli:main"

[build-system]
requires = ["uv_build >= 0.12.16, < 0.13"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",
  "D213",
  "COM812",
]
